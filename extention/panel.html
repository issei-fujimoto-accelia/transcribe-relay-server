<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>リアルタイム文字起こし</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    button {
      flex: 1;
      padding: 9px;
      font-weight: 600;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    button.stop { background: #dc2626; }
    button.stop:hover { background: #b91c1c; }
    button.clear {
      flex: 0 0 auto;
      background: #333;
      padding: 0 12px;
    }
    button.clear:hover { background: #444; }

    /* 字幕表示エリア */
    #captions {
      flex: 1;
      overflow-y: auto;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .caption-item {
        background: #27272a;
        padding: 10px 14px;
        border-radius: 6px;
        border-left: 3px solid #3b82f6;
        animation: fadeIn 0.15s ease-out;
    }
    .caption-ja {
        font-size: 16px;
        font-weight: 500;
        color: #ffffff;
        line-height: 1.5;
    }
    .caption-en {
        font-size: 12px;
        color: #9ca3af;
        margin-top: 4px;
        line-height: 1.4;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .empty-hint {
      color: #71717a;
      font-size: 13px;
      text-align: center;
      margin-top: 40px;
    }

    /* システムログ（折りたたみ可能） */
    details {
      margin-top: 10px;
      font-size: 11px;
      color: #a1a1aa;
    }
    summary {
      cursor: pointer;
      user-select: none;
      margin-bottom: 4px;
    }
    #syslog {
      height: 70px;
      overflow-y: auto;
      background: #09090b;
      padding: 6px 8px;
      border-radius: 4px;
      font-family: monospace;
      white-space: pre-wrap;
      border: 1px solid #27272a;
    }
    .err-log { color: #f87171; }
    .suc-log { color: #4ade80; }
  </style>
</head>
<body>
  <header>
    <button id="toggleBtn">共有対象を選択して開始</button>
    <button id="clearBtn" class="clear" title="字幕を消去">クリア</button>
  </header>

  <div id="captions">
    <div class="empty-hint" id="emptyHint">「開始」を押して対象の動画タブ（音声共有ON）を選択してください</div>
  </div>

  <details>
    <summary>システムステータス / 接続ログ</summary>
    <div id="syslog"></div>
  </details>

  <script src="panel.js"></script>
</body>
</html>
